<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cupa Club DJ</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dj-app {
            width: 100%;
            max-width: 520px;
            padding: 30px;
            box-sizing: border-box;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .logo span {
            color: #ff6a00;
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
        }

        .status {
            text-align: center;
            color: #aaa;
            margin-bottom: 20px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        #start-button {
            background: #ff6a00;
            color: white;
            width: 100%;
        }

        #start-button:disabled {
            opacity: 0.6;
        }

        .now-playing {
            margin-top: 25px;
            padding: 20px;
            background: #1d1d1d;
            border-radius: 16px;
        }

        .now-playing-label {
            color: #ff6a00;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .song-title {
            font-size: 20px;
            font-weight: 700;
            margin-top: 8px;
        }

        .song-channel {
            color: #aaa;
            font-size: 14px;
            margin-top: 5px;
        }

        .player {
            margin-top: 20px;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: black;
            border-radius: 12px;
            overflow: hidden;
        }

        .player iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .next-button {
            width: 100%;
            margin-top: 15px;
            background: #333;
            color: white;
        }

        .next-button:hover {
            background: #444;
        }

        .next-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .queue {
            margin-top: 25px;
        }

        .queue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .queue-header h2 {
            margin: 0;
            font-size: 18px;
        }

        .queue-count {
            color: #aaa;
            font-size: 14px;
        }

        .queue-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .queue-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            background: #1d1d1d;
            border-radius: 12px;
        }

        .queue-number {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
        }

        .queue-song {
            min-width: 0;
        }

        .queue-song-title {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .queue-song-channel {
            color: #888;
            font-size: 12px;
            margin-top: 3px;
        }

        .empty-queue {
            color: #777;
            text-align: center;
            padding: 15px;
            background: #181818;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<main class="dj-app">

    <div class="logo">
        CUPA<span>CLUB</span>
    </div>

    <h1>DJ Mode 🎧</h1>

    <p id="status" class="status">
        Radio is stopped.
    </p>

    <button id="start-button">
        Start Cupa Club Radio
    </button>

    <section class="now-playing">

        <div class="now-playing-label">
            Now Playing
        </div>

        <div id="song-title" class="song-title">
            Nothing playing
        </div>

        <div id="song-channel" class="song-channel"></div>

        <div id="player" class="player"></div>

        <button
            id="next-button"
            class="next-button"
            disabled
        >
            Next Song ⏭
        </button>

    </section>

    <section class="queue">

        <div class="queue-header">

            <h2>Up Next</h2>

            <span id="queue-count" class="queue-count">
                0 / 5
            </span>

        </div>

        <div id="queue-list" class="queue-list">

            <div class="empty-queue">
                No songs waiting.
            </div>

        </div>

    </section>

</main>

<script src="https://www.youtube.com/iframe_api"></script>

<script>

const WORKER_URL =
    "https://cupa-club-radio.pratikchavan2468.workers.dev";

const startButton =
    document.getElementById("start-button");

const nextButton =
    document.getElementById("next-button");

const status =
    document.getElementById("status");

const songTitle =
    document.getElementById("song-title");

const songChannel =
    document.getElementById("song-channel");

const playerContainer =
    document.getElementById("player");

const queueList =
    document.getElementById("queue-list");

const queueCount =
    document.getElementById("queue-count");


let radioStarted = false;
let currentSong = null;
let youtubePlayer = null;
let polling = false;
let pollTimer = null;
let youtubeReady = false;
let finishingSong = false;


/* -------------------------
   YOUTUBE API READY
------------------------- */

window.onYouTubeIframeAPIReady = function () {

    youtubeReady = true;

};


/* -------------------------
   START RADIO
------------------------- */

startButton.addEventListener("click", () => {

    if (radioStarted) {
        return;
    }

    radioStarted = true;

    startButton.disabled = true;

    startButton.textContent =
        "Radio is running";

    status.textContent =
        "Waiting for requests... 🎧";

    createPlayer();

    checkQueue();

    pollTimer = setInterval(
        checkQueue,
        3000
    );

});


/* -------------------------
   CREATE PLAYER ONCE
------------------------- */

function createPlayer() {

    if (!youtubeReady || youtubePlayer) {
        return;
    }

    playerContainer.innerHTML =
        `<div id="youtube-player"></div>`;

    youtubePlayer =
        new YT.Player(
            "youtube-player",
            {

                width: "100%",

                height: "100%",

                playerVars: {

                    autoplay: 0,

                    rel: 0,

                    playsinline: 1

                },

                events: {

                    onReady:
                        onPlayerReady,

                    onStateChange:
                        onPlayerStateChange,

                    onError:
                        onPlayerError

                }

            }
        );

}


/* -------------------------
   PLAYER READY
------------------------- */

function onPlayerReady(event) {

    /*
     * The user has already tapped
     * Start Cupa Club Radio.
     *
     * The player is now ready for
     * controlled playback.
     */

    checkQueue();

}


/* -------------------------
   CHECK QUEUE
------------------------- */

async function checkQueue() {

    if (!radioStarted || polling) {
        return;
    }

    polling = true;

    try {

        const response = await fetch(
            `${WORKER_URL}/requests`
        );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not load queue"
            );

        }

        const requests =
            data.requests || [];

        renderQueue(requests);


        /*
         * Nothing is playing.
         * Start the first request.
         */

        if (
            !currentSong &&
            requests.length > 0
        ) {

            await startSong(
                requests[0]
            );

        }

    } catch (error) {

        console.error(error);

        status.textContent =
            "Connection problem. Retrying...";

    } finally {

        polling = false;

    }

}


/* -------------------------
   START SONG
------------------------- */

async function startSong(request) {

    if (!youtubePlayer || currentSong) {
        return;
    }

    currentSong = request;

    finishingSong = false;

    status.textContent =
        "Now playing 🎵";

    songTitle.textContent =
        request.title;

    songChannel.textContent =
        request.channel || "";

    nextButton.disabled = false;


    /*
     * Tell server this song is playing.
     */

    try {

        await fetch(
            `${WORKER_URL}/request/start`,
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    id:
                        request.id
                })

            }
        );

    } catch (error) {

        console.error(
            "Could not mark song as playing:",
            error
        );

    }


    /*
     * IMPORTANT:
     *
     * Reuse the SAME YouTube player.
     *
     * This is much better for autoplay
     * than destroying and recreating it.
     */

    youtubePlayer.loadVideoById(
        request.video_id
    );

}


/* -------------------------
   PLAYER STATE CHANGE
------------------------- */

function onPlayerStateChange(event) {

    /*
     * ENDED = 0
     */

    if (
        event.data ===
        YT.PlayerState.ENDED
    ) {

        finishCurrentSong();

    }

}


/* -------------------------
   PLAYER ERROR
------------------------- */

function onPlayerError(event) {

    console.error(
        "YouTube player error:",
        event.data
    );

    finishCurrentSong();

}


/* -------------------------
   NEXT BUTTON
------------------------- */

nextButton.addEventListener(
    "click",
    () => {

        if (
            !currentSong ||
            finishingSong
        ) {
            return;
        }

        finishCurrentSong();

    }
);


/* -------------------------
   FINISH SONG
------------------------- */

async function finishCurrentSong() {

    if (
        !currentSong ||
        finishingSong
    ) {
        return;
    }

    finishingSong = true;

    const finishedSong =
        currentSong;


    status.textContent =
        "Loading next song... 🎵";


    /*
     * Mark previous song as played.
     */

    try {

        await fetch(
            `${WORKER_URL}/request/played`,
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    id:
                        finishedSong.id
                })

            }
        );

    } catch (error) {

        console.error(
            "Could not mark song as played:",
            error
        );

    }


    /*
     * Clear current song.
     */

    currentSong = null;

    nextButton.disabled = true;


    /*
     * Get the next song.
     *
     * We wait briefly for D1 to finish
     * updating the previous request.
     */

    setTimeout(
        async () => {

            finishingSong = false;

            await checkQueue();

        },
        250
    );

}


/* -------------------------
   RENDER QUEUE
------------------------- */

function renderQueue(requests) {

    const pending =
        requests.filter(
            request =>
                !currentSong ||
                request.id !== currentSong.id
        );


    queueCount.textContent =
        `${pending.length} / 5`;


    if (!pending.length) {

        queueList.innerHTML = `
            <div class="empty-queue">
                No songs waiting.
            </div>
        `;

        return;

    }


    queueList.innerHTML = "";


    pending.forEach(
        (request, index) => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "queue-item";


            item.innerHTML = `

                <div class="queue-number">
                    ${index + 1}
                </div>

                <div class="queue-song">

                    <div class="queue-song-title">
                        ${escapeHTML(
                            request.title
                        )}
                    </div>

                    <div class="queue-song-channel">
                        ${escapeHTML(
                            request.channel || ""
                        )}
                    </div>

                </div>
            `;


            queueList.appendChild(item);

        }
    );

}


/* -------------------------
   ESCAPE HTML
------------------------- */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}

</script>

</body>
</html>

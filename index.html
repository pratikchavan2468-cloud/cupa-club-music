<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cupa Club | Pick Your Song</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="header">

            <div class="logo">
                CUPA<span>CLUB</span>
            </div>

            <div class="coffee-icon">
                ☕
            </div>

        </header>


        <section class="hero">

            <p class="eyebrow">
                CUPA CLUB RADIO
            </p>

            <h1>
                Pick a song<br>
                for your coffee.
            </h1>

            <p class="subtitle">
                Choose something that matches your mood.
            </p>

        </section>


        <section class="search-section">

            <div class="search-box">

                <span>⌕</span>

               <input
    type="text"
    id="search-input"
    placeholder="Search a song or artist..."
>

<button id="search-button">Search</button>

</div>

        </section>


        <section class="songs">

            <div class="section-header">

                <h2>
                    Cupa Club Picks
                </h2>

                <span>
                    ☕
                </span>

            </div>


           <div id="results" class="song-list">

                <!-- Songs will appear here -->

            </div>

        </section>
        
        <section id="player-container" class="player-container"></section>

        <footer>

            <p>
                Made for good coffee & better music.
            </p>

            <div class="footer-logo">
                CUPA CLUB
            </div>

        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>

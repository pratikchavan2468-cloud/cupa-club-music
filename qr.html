<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cupa Club QR</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #ffffff;
            color: #111111;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .qr-app {
            width: 100%;
            max-width: 520px;

            text-align: center;
        }

        .logo {
            font-size: 34px;
            font-weight: 900;

            letter-spacing: -1px;

            margin-bottom: 8px;
        }

        .logo span {
            color: #ff6a00;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .qr-box {
            width: min(80vw, 420px);
            height: min(80vw, 420px);

            margin: 0 auto;

            background: white;

            display: flex;
            justify-content: center;
            align-items: center;

            border: 1px solid #eeeeee;
            border-radius: 20px;
        }

        #qr {
            width: 90%;
            height: 90%;
        }

        .queue-full {
            width: min(80vw, 420px);
            min-height: min(80vw, 420px);

            margin: 0 auto;

            background: #111111;
            color: white;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            border-radius: 20px;

            padding: 30px;
        }

        .queue-full-icon {
            font-size: 52px;
            margin-bottom: 15px;
        }

        .queue-full h2 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .queue-full p {
            margin: 0;
            color: #bbbbbb;
            line-height: 1.5;
        }

        .instruction {
            margin-top: 25px;

            font-size: 22px;
            font-weight: 700;
        }

        .status {
            margin-top: 20px;

            font-size: 14px;
            color: #999;
        }

        .hidden {
            display: none !important;
        }

    </style>
</head>

<body>

<main class="qr-app">

    <div class="logo">
        CUPA<span>CLUB</span>
    </div>

    <div class="subtitle">
        Pick a song while you wait ☕🎧
    </div>


    <!-- QR AREA -->

    <div id="qr-area">

        <div class="qr-box">

            <canvas id="qr"></canvas>

        </div>

        <div class="instruction">
            Scan to pick your song
        </div>

    </div>


    <!-- QUEUE FULL AREA -->

    <div
        id="queue-full-area"
        class="queue-full hidden"
    >

        <div class="queue-full-icon">
            ☕
        </div>

        <h2>
            Queue Full
        </h2>

        <p>
            We've got 5 songs lined up right now.
            <br>
            Please check back in a little while.
        </p>

    </div>


    <div id="status" class="status">
        Checking Cupa Club queue...
    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>


<script>

const WORKER_URL =
    "https://cupa-club-radio.pratikchavan2468.workers.dev";

const CUSTOMER_URL =
    "https://cupa-club-music.pratikchavan2468.workers.dev";


const qrArea =
    document.getElementById("qr-area");

const queueFullArea =
    document.getElementById("queue-full-area");

const qrCanvas =
    document.getElementById("qr");

const status =
    document.getElementById("status");


let currentToken = null;

let queueCheckTimer = null;

let creatingQR = false;

let checkingSession = false;


// ---------------------------------
// CHECK QUEUE STATUS
// ---------------------------------

async function checkQueueStatus() {

    try {

        const response =
            await fetch(
                `${WORKER_URL}/qr/status`
            );

        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not check queue."
            );

        }


        if (data.queueFull) {

            showQueueFull();

            return;

        }


        if (currentToken) {

            await checkCurrentSession();

        } else {

            createQRSession();

        }


    } catch (error) {

        console.error(error);

        status.textContent =
            "Connection problem. Retrying...";

    }

}


// ---------------------------------
// SHOW QUEUE FULL
// ---------------------------------

function showQueueFull() {

    qrArea.classList.add(
        "hidden"
    );

    queueFullArea.classList.remove(
        "hidden"
    );

    status.textContent =
        "Waiting for a spot to open...";

}


// ---------------------------------
// CREATE QR
// ---------------------------------

async function createQRSession() {

    if (creatingQR) {
        return;
    }


    creatingQR = true;


    qrArea.classList.remove(
        "hidden"
    );

    queueFullArea.classList.add(
        "hidden"
    );


    status.textContent =
        "Creating secure session...";


    try {

        const response =
            await fetch(
                `${WORKER_URL}/qr/create`,
                {
                    method: "POST"
                }
            );


        const data =
            await response.json();


        if (
            response.status === 429 ||
            data.queueFull
        ) {

            currentToken = null;

            showQueueFull();

            return;

        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not create QR."
            );

        }


        currentToken =
            data.token;


        const customerUrl =
            `${CUSTOMER_URL}/?session=${encodeURIComponent(
                currentToken
            )}`;


        await QRCode.toCanvas(
            qrCanvas,
            customerUrl,
            {
                width: 380,
                margin: 2,
                errorCorrectionLevel: "M"
            }
        );


        status.textContent =
            "QR is active";


    } catch (error) {

        console.error(error);


        currentToken = null;


        status.textContent =
            "Could not create QR. Retrying...";


    } finally {

        creatingQR = false;

    }

}


// ---------------------------------
// CHECK CURRENT QR SESSION
// ---------------------------------

async function checkCurrentSession() {

    if (
        !currentToken ||
        checkingSession ||
        creatingQR
    ) {

        return;

    }


    checkingSession = true;


    try {

        const response =
            await fetch(
                `${WORKER_URL}/qr/validate?token=${encodeURIComponent(
                    currentToken
                )}`
            );


        const data =
            await response.json();


        /*
         * QR was used.
         *
         * Create a completely new QR.
         */

        if (
            !response.ok ||
            !data.valid
        ) {

            currentToken = null;


            status.textContent =
                "Creating new QR...";


            await createQRSession();


            return;

        }


        /*
         * QR is still active.
         */

        qrArea.classList.remove(
            "hidden"
        );

        queueFullArea.classList.add(
            "hidden"
        );


        status.textContent =
            "QR is active";


    } catch (error) {

        console.error(error);

    } finally {

        checkingSession = false;

    }

}


// ---------------------------------
// LIVE QUEUE CHECK
// ---------------------------------

queueCheckTimer =
    setInterval(
        async () => {

            await checkQueueStatus();

        },
        3000
    );


// ---------------------------------
// INITIAL LOAD
// ---------------------------------

checkQueueStatus();

</script>

</body>
</html>
